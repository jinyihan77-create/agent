<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f3"><title>Personal AI Fund Manager</title><link rel="stylesheet" href="/health.css"><script type="module" src="/health.js"></script></head>
<body><a class="skip" href="#question">跳到输入框</a>
<aside id="sidebar" aria-label="对话与持仓记录"><div class="side-head"><span class="brand-icon">◈</span><strong>Personal AI<br>Fund Manager</strong><button id="close-sidebar" aria-label="收起历史">×</button></div><button id="new-chat" class="new-chat"><span>＋</span> 新对话</button><p class="history-label">最近对话</p><nav id="history" aria-label="对话历史"></nav><details id="saved-section" class="saved-section"><summary>持仓记录 <span id="snapshot-count">0</span></summary><div id="snapshots"></div><button id="compare-records" class="quiet-button">比较两份记录</button></details><div class="side-foot">与你的浏览器访客身份关联<br><span>云端保存 · 不跨浏览器自动同步</span></div></aside>
<div id="shade" hidden></div>
<main><header><button id="menu" aria-label="打开历史会话" aria-controls="sidebar" aria-expanded="false">☰</button><a href="/">Personal AI Fund Manager</a><span class="header-note">核对 · 记录 · 比较</span></header>
<div id="scroll-area"><section id="welcome"><div class="welcome-mark">◈</div><p class="eyebrow">从一份清楚的持仓开始</p><h1>把持仓核对清楚，留一份记录，<br>下次直接看变化</h1><p>说出名称和金额，就能先看比例。资料不全的地方，我们会标明。</p><div id="examples"><button data-example="holdings"><span class="example-label">试一份演示持仓</span>股票A 6万、基金B 2万、现金2万</button><button data-example="concept"><span class="example-label">从问题开始</span>什么是持仓集中度？</button></div><button id="start-table" class="text-button">已有表格？粘贴或手动录入 →</button></section><section id="messages" aria-label="当前对话"></section><section id="current-review" aria-label="当前持仓核对" hidden></section><div id="bottom-anchor"></div></div>
<div class="composer-wrap"><button id="to-bottom" hidden>↓ 回到最新消息</button><div id="notice" role="alert" hidden></div><form id="composer"><label class="sr-only" for="question">发送消息</label><textarea id="question" rows="2" maxlength="2000" placeholder="说说你的持仓，或继续追问…"></textarea><div class="composer-bottom"><span>Enter 发送 · Shift + Enter 换行</span><button id="send" type="submit" aria-label="发送消息">↑</button><button id="stop" type="button" hidden>■ 停止</button></div></form><p class="footer-note">公开试用请用虚构数据。仅分析和模拟，不执行交易。</p></div>
</main>
<dialog id="record-dialog" aria-labelledby="record-title"><div class="dialog-heading"><h2 id="record-title">持仓记录</h2><button id="close-record" aria-label="关闭持仓记录">×</button></div><div id="record-content"></div><div id="record-notice" role="status"></div></dialog>
</body></html>
